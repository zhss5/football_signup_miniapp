<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>足球报名后台</title>
    <link rel="stylesheet" href="./styles.css?v=20260618-confirm-activity" />
  </head>
  <body>
    <main id="admin-app" class="admin-shell">
      <section data-view="identity" class="status-panel">正在检查身份...</section>

      <section data-view="login" class="login-panel" hidden>
        <div class="login-copy">
          <h1>后台管理登录</h1>
          <p>
            打开小程序，进入“我的”，点击“后台登录”，扫描此二维码。
          </p>
          <p data-login-status class="login-status"></p>
          <button type="button" data-action="restart-login">重试</button>
        </div>
        <div class="login-qr-card">
          <canvas data-login-qr width="220" height="220" aria-label="后台登录二维码"></canvas>
          <textarea data-login-payload readonly></textarea>
        </div>
      </section>

      <section data-view="forbidden" class="status-panel" hidden>
        需要组织者或管理员权限。
      </section>

      <section data-view="workspace" class="admin-workspace" hidden>
        <div data-admin-layout class="admin-layout">
          <aside data-admin-sidebar class="admin-sidebar">
            <div class="brand-block">
              <h1>足球报名后台</h1>
              <p data-current-user></p>
            </div>

            <nav class="admin-nav" aria-label="后台导航">
              <button type="button" data-nav-target="users">用户管理</button>
              <button type="button" data-nav-target="activities">活动管理</button>
              <button type="button" data-nav-target="attendance-stats">出勤统计</button>
              <button type="button" data-nav-target="exports">名单导出</button>
              <button type="button" data-nav-target="logs">日志</button>
            </nav>
          </aside>

          <main data-admin-content class="admin-content">
            <header class="topbar">
              <h2 data-current-view-title>活动管理</h2>
              <div class="topbar-account">
                <div class="account-copy">
                  <strong data-current-user-summary></strong>
                  <code data-current-user-openid></code>
                </div>
                <button type="button" data-action="logout">退出登录</button>
              </div>
            </header>

            <section data-view="users" data-admin-view="users" class="panel" hidden>
              <h3>用户角色</h3>

              <form data-action="search-users" class="toolbar">
                <label>
                  <span>关键词</span>
                  <input name="keyword" type="search" placeholder="openid、姓名、昵称" />
                </label>

                <label>
                  <span>角色</span>
                  <select data-role-filter>
                    <option value="">全部角色</option>
                    <option value="user">普通用户</option>
                    <option value="organizer">组织者</option>
                    <option value="admin">管理员</option>
                    <option value="super_admin">超级管理员</option>
                  </select>
                </label>

                <button type="submit" data-users-search-button>搜索</button>
              </form>

              <p data-users-status class="inline-status" aria-live="polite"></p>

              <table class="data-table users-table">
                <thead>
                  <tr>
                    <th>用户</th>
                    <th>OpenID</th>
                    <th>备注</th>
                    <th>当前角色</th>
                    <th>角色管理</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody data-users-table></tbody>
              </table>
            </section>

            <section data-view="activities" data-admin-view="activities" class="panel">
              <h3>活动运营</h3>

              <form data-action="search-activities" class="toolbar">
                <label>
                  <span>关键词</span>
                  <input name="activityKeyword" type="search" placeholder="标题、场地、openid" />
                </label>

                <label>
                  <span>状态</span>
                  <select name="activityStatus">
                    <option value="">可见状态</option>
                    <option value="draft">草稿</option>
                    <option value="pending">待处理</option>
                    <option value="published">已发布</option>
                    <option value="cancelled">已取消</option>
                  </select>
                </label>

                <label>
                  <span>组织者 OpenID</span>
                  <input name="activityOrganizerOpenId" type="search" placeholder="管理员筛选" />
                </label>

                <label>
                  <span>开始日期</span>
                  <input name="activityStartAtFrom" type="date" />
                </label>

                <label>
                  <span>结束日期</span>
                  <input name="activityStartAtTo" type="date" />
                </label>

                <button type="submit" data-activities-search-button>搜索</button>
              </form>

              <table class="data-table">
                <thead>
                  <tr>
                    <th>活动</th>
                    <th>开始时间</th>
                    <th>状态</th>
                    <th>组织者</th>
                    <th>报名数</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody data-activities-table></tbody>
              </table>

              <div data-activity-detail class="detail-panel" hidden>
                <div class="detail-header">
                  <h4 data-activity-title></h4>
                </div>

                <table class="data-table">
                  <thead>
                    <tr>
                      <th>队伍</th>
                      <th>报名名</th>
                      <th>备注</th>
                      <th>位置偏好</th>
                      <th>代报名</th>
                      <th>出勤状态</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody data-roster-table></tbody>
                </table>
              </div>
            </section>

            <section data-admin-view="attendance-stats" class="panel" hidden>
              <h3>出勤统计</h3>

              <form data-action="load-attendance-stats" class="toolbar">
                <label>
                  <span>统计开始</span>
                  <input name="statsStartAt" type="date" />
                </label>

                <label>
                  <span>统计结束</span>
                  <input name="statsEndAt" type="date" />
                </label>

                <button type="submit" data-stats-load-button>加载统计</button>
              </form>

              <p data-attendance-stats-empty class="inline-status" aria-live="polite" hidden>
                仅统计已确认举行活动；当前范围内没有出勤记录。
              </p>

              <table class="data-table">
                <thead>
                  <tr>
                    <th>参与者</th>
                    <th>报名次数</th>
                    <th>出勤</th>
                    <th>缺勤</th>
                    <th>出勤率</th>
                  </tr>
                </thead>
                <tbody data-attendance-stats-table></tbody>
              </table>
            </section>

            <section data-admin-view="exports" class="panel" hidden>
              <h3>名单导出</h3>

              <div class="toolbar">
                <button type="button" data-action="export-roster">导出名单 CSV</button>
              </div>

              <textarea data-export-output class="export-output" readonly></textarea>
            </section>

            <section data-admin-view="logs" class="panel" hidden>
              <h3>日志</h3>

              <div class="log-actions">
                <button type="button" data-action="load-activity-logs">加载操作日志</button>
                <button type="button" data-action="load-notification-logs">加载通知日志</button>
              </div>

              <div class="log-grid">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>操作</th>
                      <th>操作者</th>
                      <th>对象</th>
                      <th>创建时间</th>
                    </tr>
                  </thead>
                  <tbody data-activity-logs-table></tbody>
                </table>

                <table class="data-table">
                  <thead>
                    <tr>
                      <th>类型</th>
                      <th>对象</th>
                      <th>状态</th>
                      <th>创建时间</th>
                    </tr>
                  </thead>
                  <tbody data-notification-logs-table></tbody>
                </table>
              </div>
            </section>
          </main>
        </div>

        <template id="role-control-template">
          <label class="role-toggle">
            <input type="checkbox" data-role="organizer" />
                <span>组织者</span>
          </label>
          <label class="role-toggle">
            <input type="checkbox" data-role="admin" />
            <span>管理员</span>
          </label>
        </template>
      </section>
    </main>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="./config.test.js?v=20260618-confirm-activity"></script>
    <script src="./src/cloudbase-runtime.js?v=20260618-confirm-activity"></script>
    <script src="./src/roles.js?v=20260618-confirm-activity"></script>
    <script src="./src/api.js?v=20260618-confirm-activity"></script>
    <script src="./vendor/qrcode.min.js?v=20260618-confirm-activity"></script>
    <script src="./src/user-management.js?v=20260618-confirm-activity"></script>
    <script src="./src/activity-management.js?v=20260618-confirm-activity"></script>
    <script src="./src/app.js?v=20260618-confirm-activity"></script>
  </body>
</html>
